version: "3.8"

services:
  ethmysql:
    image: "mysql:latest"
    environment:
      - MYSQL_ROOT_PASSWORD=12345678
    deploy:
      restart_policy:
        condition: any
      placement:
        constraints:
          - node.labels.role == mysql
    volumes:
      - /etc/localtime:/etc/localtime
      - ${BASEDIR}./data/mysql/data:/var/lib/mysql
      - ${BASEDIR}./v5/config/mysql/conf/my.cnf:/etc/my.cnf
      - ${BASEDIR}./v5/config/mysql/init:/docker-entrypoint-initdb.d/
    networks:
      - meta

  execute1:
    image: tscel/geth:v1.13-base-v5
    entrypoint: /usr/local/bin/execution.sh
    deploy:
      restart_policy:
        condition: on-failure
        delay: 1s
        max_attempts: 100
        window: 120s
      placement:
        constraints:
          - node.labels.service-set == 1
    volumes:
      - ${BASEDIR}./v5/config:/root/config
      - ${BASEDIR}./data/execute1:/root/gethdata
      - ${BASEDIR}./entrypoint/execute.sh:/usr/local/bin/execution.sh
    networks:
      - meta

  execute2:
    image: tscel/geth:v1.13-base-v5
    entrypoint: /usr/local/bin/execution.sh
